[package]
name = "bough-fx-bench"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "bough-fx-bench"

[workspace]

[dependencies]
bough = { path = "../../crates/bough" }
bough-sys = { path = "../../crates/bough-sys" }
bough-dataflow = { path = "../../crates/bough-dataflow", optional = true }
bough-flat = { path = "../../crates/bough-flat" }

[features]
full-effects = []
typed-core = ["dep:bough-dataflow"]

[[bin]]
name = "typed-core"
path = "src/bin/typed-core.rs"
required-features = ["typed-core"]

[[bin]]
name = "flat-core"
path = "src/bin/flat-core.rs"

[patch.crates-io]
wgpu-hal = { path = "../../vendor/wgpu-hal" }
wgpu-types = { path = "../../vendor/wgpu-types" }
naga = { path = "../../vendor/naga" }

[patch."https://github.com/schell/wgsl-rs"]
wgsl-rs = { path = "../../vendor/wgsl-rs/crates/wgsl-rs" }
wgsl-rs-macros = { path = "../../vendor/wgsl-rs/crates/wgsl-rs-macros" }
wgsl-rs-ir = { path = "../../vendor/wgsl-rs/crates/wgsl-rs-ir" }
