[package]
name = "bough-x"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Round 8: a UI as a typed dataflow. Expressions as types with the stage inferred, finite-difference damage over exposed pages, archetype columns in 64-record pages, description by continuation"

[dependencies]
bough-expr = { path = "../bough-expr" }
bough-lay = { path = "../bough-lay" }
# Prepared faces, shaped lines as two-word runs, the span kernel (text lane). No dependencies of its own.
bough-face = { path = "../bough-face" }

[dev-dependencies]
bough-mem = { path = "../bough-mem" }

[features]
# Compiles the negative-control switches of the flat core and the damage engine (`damage_engine::mutant`):
# tests/flat_mutants.rs turns each on and requires its oracle to fail.
flat_mutants = []
# phase marks for splitting a pass's cost (`probe.rs`); off: a mark is nothing
phase_probe = []
inspect-metadata = ["bough-lay/inspect-metadata"]
# Negative control of the leaf-site gate: every leaf keeps the row/list call site.
mutant_same_site = []
mutant_repair_bounds = []
# Mutants the pixel gates (tests/sheet.rs) must fail with:
# the derivative forgets every other record of a page
mutant_delta = []
# a list ignores the relation's journal
mutant_journal = []
# Dropping a subscribed journal fails to notify the world of source replacement.
mutant_journal_drop = []
# rows kept across an insert or a remove keep their old rects (bough's typed list gates must fail)
mutant_rigid = []
# a moved record damages only where it is now; a record in motion only where it will rest
mutant_moves = []
# a frame with records in motion damages nothing
mutant_sweep = []
# a line of text whose colour reads the block is never found changed (tests/text.rs must fail)
mutant_line = []
# reflection takes a list record's ring slot for its row (tests/reflect.rs must fail)
mutant_reflect = []

# a free row that enters is not damaged (bough's lowered pixel gates must fail)
mutant_free_enter = []
# a free row that leaves is not damaged
mutant_free_leave = []

# Drops the second changed word from the sparse reader union.
mutant_sparse_union = []

# ---- the incremental-operators card (docs/lanes/core/cards/2026-11-21-incremental-operators.md) ----
# an order lane's split leaves the block tree as it was (rel::lane tests and tests/ops.rs must fail)
mutant_lane = []
# a filter ignores an update of a row (tests/ops.rs must fail)
mutant_ops = []
# a substring query takes the index's candidates without verifying them (tests/search_ops.rs must fail)
mutant_tri = []
# the key index forgets the records keyed by the old value (tests/select.rs must fail)
mutant_keyed = []
# the pointer's reach is tested at half the declared distance (tests/select.rs must fail)
mutant_near = []
# a swept rect is not handed over (tests/select.rs must fail)
mutant_swept = []
# the column-wide derivative of a constant-free archetype answers "unchanged" (tests/uniform.rs must fail)
mutant_uniform = []
# the clipped column walk loses the last record of every page (tests/each_in.rs must fail)
mutant_each_in = []
# a broad word's change damages nothing (tests/broad.rs must fail)
mutant_broad = []
# the world never marks a column as having a bounded delta in its table entry: every delta is the page scan
mutant_fastcol = []
# a gapped page skips its record 0 (store.rs page_delta_tests must fail)
mutant_gap = []
