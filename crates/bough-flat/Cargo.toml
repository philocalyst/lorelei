[package]
name = "bough-flat"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The flat core: a UI as plain data. State words behind branded handles, sixteen-byte bindings, records as parallel arrays with a sparse dependency index, the driver over the damage engine, and the reference raster. No generics in the data path, no unsafe"

[dependencies]
bough-damage = { path = "../bough-damage" }

[dev-dependencies]
bough-mem = { path = "../bough-mem" }

[features]
# Compiles the negative-control switches of the flat core and the damage engine (`bough_damage::mutant`):
# tests/mutants.rs turns each on and requires its oracle to fail.
mutants = ["bough-damage/mutants"]
