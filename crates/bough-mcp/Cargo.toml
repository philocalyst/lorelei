[package]
name = "bough-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Model Context Protocol server for a running lorelei (bough) application: stdio and streamable HTTP, over the bough-inspect socket. Model surface after fakeland-mcp; an in-process inspector knows more (source locations, dependencies, why-did-this-repaint)"

[dependencies]
bough-inspect = { path = "../bough-inspect" }

[[bin]]
name = "bough-mcp"
path = "src/main.rs"
