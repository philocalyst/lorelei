[package]
name = "bough-inspect-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A headless host for the inspector: the real comparison apps (bough-guibench-dataflow Rows/Table/Search/Spinner) with the agent/test socket, and the element-layer overlay. Built with `inspect` off, it is the zero-cost control"

[dependencies]
bough-dataflow = { path = "../bough-dataflow" }
bough-span = { path = "../bough-span" }
bough-host = { path = "../bough-host" }
bough-guibench-dataflow = { path = "../../comparisons/bough-guibench-dataflow" }
bough-inspect = { path = "../bough-inspect", optional = true }

[dev-dependencies]
bough-mcp = { path = "../bough-mcp" }
bough-dev = { path = "../bough-dev" }
bough-mem = { path = "../bough-mem" }

[features]
default = ["inspect"]
# Negative control of the live-overlay gate: the panel is painted even when it was never opened.
mutant_overlay_paint = []
inspect = ["dep:bough-inspect", "bough-guibench-dataflow/inspect-metadata"]

[[bin]]
name = "bough-inspect-app"
path = "src/main.rs"
