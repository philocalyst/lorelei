[package]
name = "bough-paint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Round 8 raster lane: paints as types, one monomorphised CPU kernel and one generated GPU function per archetype, the plan fixed at compile time"

[dependencies]
bough-kernel = { path = "../bough-kernel" }
bough-expr = { path = "../bough-expr" }
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3" }
objc2-metal = { version = "0.3" }

[build-dependencies]
bough-kernel = { path = "../bough-kernel" }
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false }
naga = { version = "29.0.4", features = ["wgsl-in", "msl-out"] }

[dev-dependencies]
bough-mem = { path = "../bough-mem" }
# the media benchmark gives each video tile an audio clock (examples and tests only: the library has no audio)
bough-audio = { path = "../bough-audio" }
naga = { version = "29.0.4", features = ["wgsl-in", "msl-out"] }
# the `#[wgsl]` macro's generated `__validate_wgsl` tests (naga validation of each module); tests only
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }

[features]
# Mutants for the exactness gate (tests/exact.rs must fail with each):
# the tile rasteriser's core is one pixel too wide
mutant_core = []
# the bin cut treats an opaque paint's whole window as its cover
mutant_cut = []
# the flat-row classifier treats a rounded box's corner rows as flat
mutant_flat = []
# the static cut inside a composed paint hides one column too many
mutant_hide = []
# the pixel-grain occlusion mask of the tile rasteriser is one column too wide
mutant_mask = []
# every entry of a CPU-filled corner table is one too large
mutant_tab = []
# Mutants for the effects gates (tests/fx.rs must fail with each):
# a dirty pyramid block does not reach the blocks whose taps touch it from the next block over
mutant_layer_dilate = []
# a change beneath a layer does not dirty it
mutant_layer_event = []
# the pyramid's downsample is one unit off
mutant_layer_weights = []
# a record leaves the active set before its last frame is drawn
mutant_settle = []
# a rewritten record that did not move (a video showing a new frame) damages nothing
mutant_video = []
# a layer record's changed halo damages nothing (tests/fx.rs must fail)
mutant_halo_damage = []
# a moved window is not inserted in the bins of the tiles it entered (tests/fx.rs must fail; leaving a
# stale entry behind instead cannot be seen: a record shades nothing outside its window)
mutant_bins_stale = []
# a broad change does not mark the layers for repair (tests/fx.rs must fail)
mutant_broad_layers = []
# the resident whole-frame jobs are reused after the bins or the layer table changed (tests/fx.rs must fail)
# a repaired block in an even column counts as unchanged whatever it holds (tests/fx.rs must fail)
mutant_prune = []
# a pan visits the records near the new viewport only, not those near the old one (tests/fx.rs must fail)
mutant_scroll_band = []
# a change of a key word visits the records of its new value only (tests/fx.rs must fail)
mutant_key_old = []
mutant_cert = []
mutant_slab_stale = []
mutant_forced = []
mutant_pal_stale = []
mutant_park = []
mutant_park_wake = []
mutant_hull_small = []
mutant_rank_seed = []
mutant_rank_stale = []
mutant_prefix_lost = []
mutant_shadow_patch = []
