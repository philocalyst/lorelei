[package]
name = "bough-damage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The damage engine: tile masks, effect hulls, opaque-cover culling, backdrop-blur footprints, scroll blits and the executor choice. No dependencies, no unsafe, no generics"

# The benchmark's calling-thread counters (`examples/damage_x.rs`); the library itself depends on nothing.
[dev-dependencies]
bough-mem = { path = "../bough-mem" }

[features]
# Compiles the negative-control switches (`mutant`): the flat core's tests/mutants.rs turns each on and requires
# its oracle to fail.
mutants = []
